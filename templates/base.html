<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>connecT AI</title><style>
:root{--green:#165c4e;--ink:#162024;--muted:#657478;--bg:#f5f7f4}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px Inter,Arial,sans-serif;color:var(--ink)}nav{background:#fff;border-bottom:1px solid #dce3df;padding:16px max(24px,calc((100% - 1100px)/2));display:flex;justify-content:space-between;align-items:center}nav a{color:var(--green);font-weight:800;text-decoration:none;margin-left:15px}.brand{font-size:20px;margin:0!important}.wrap{max-width:1100px;margin:auto;padding:40px 24px}h1{letter-spacing:-.045em;font-size:42px;margin:0 0 8px}h2{font-size:22px;margin:0 0 15px}.sub{color:var(--muted);line-height:1.6}.card{background:#fff;border:1px solid #dce3df;border-radius:16px;padding:22px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}.metric b{display:block;color:var(--green);font-size:28px}.metric span{color:var(--muted);font-size:13px}input,select,textarea{width:100%;padding:11px;border:1px solid #bfcac4;border-radius:8px;margin:6px 0 14px;font:inherit}textarea{min-height:100px}button{background:var(--green);color:#fff;border:0;border-radius:8px;padding:12px 17px;font-weight:800;cursor:pointer}.row{display:flex;justify-content:space-between;gap:18px;padding:15px 0;border-bottom:1px solid #e5ebe7}.row:last-child{border:0}.score{color:var(--green);font-size:22px;font-weight:800;white-space:nowrap}.reasons{color:var(--muted);font-size:13px;padding-left:18px}.flash{padding:12px;background:#e4f2e9;color:#175b41;border-radius:8px}@media(max-width:720px){.grid,.grid2{grid-template-columns:1fr}h1{font-size:34px}}
</style></head><body><nav><a class="brand" href="{{ url_for('dashboard') }}">connecT AI</a>{% if session.user_id %}<span><a href="{{ url_for('profile') }}">Profile</a><a href="{{ url_for('new_project') }}">Post project</a><a href="{{ url_for('logout') }}">Logout</a></span>{% endif %}</nav><main class="wrap">{% with messages=get_flashed_messages() %}{% for message in messages %}<p class="flash">{{ message }}</p>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
