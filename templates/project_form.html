{% extends 'base.html' %}{% block content %}<h1>Post a project</h1><p class="sub">Students will see this project in their model-ranked project recommendations.</p><form class="card" method="post"><label>Project title</label><input name="title" required><label>Description</label><textarea name="description" required></textarea><label>Skills needed, comma-separated</label><input name="skills" placeholder="Python, SQL, UI/UX" required><label>Domain</label><select name="domain" required>{% for domain in domains %}<option value="{{ domain }}">{{ domain }}</option>{% endfor %}</select><label>Project type</label><input name="project_type" placeholder="Data Analysis" required><button>Post project</button></form>{% endblock %}
