name: Prepare readable source
on:
  workflow_dispatch:
  push:
    branches: [complete-platform]
    paths: [.github/workflows/format-source.yml]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.5
      - run: ruff format backend ml dataset tests
      - run: npx --yes prettier@3.10.1 --write "frontend/src/**/*.{js,jsx,css}" "frontend/*.{js,json,html}"
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-source
          path: |
            backend/**/*.py
            ml/**/*.py
            dataset/*.py
            tests/*.py
            frontend/src/
            frontend/*.js
            frontend/*.json
            frontend/*.html
          retention-days: 7
