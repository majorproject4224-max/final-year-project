# Prepared only. Review hosting choices with the project owner before deploying.
services:
  - type: keyvalue
    name: connect-ai-channels
    plan: free
    region: singapore
    maxmemoryPolicy: noeviction
    ipAllowList: []
  - type: web
    name: connect-ai-api
    runtime: python
    plan: free
    region: singapore
    autoDeployTrigger: "off"
    buildCommand: pip install -r backend/requirements-lock.txt
    startCommand: bash scripts/render-start.sh
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.16
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: connect_ai
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: connect-ai-channels
          property: connectionString
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
